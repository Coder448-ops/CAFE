name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LOLA_SECRET: ci-secret-not-for-production-0001
      LOLA_DB_PATH: ./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Database migration + seed smoke test
        run: npm run db:setup
